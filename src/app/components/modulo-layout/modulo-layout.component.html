<div class="container py-4" *ngIf="modulo">
  <div class="tarjeta-vidrio px-3 py-2 mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0 small">
        <li class="breadcrumb-item"><a routerLink="/principal">Inicio</a></li>
        <li class="breadcrumb-item active" aria-current="page">{{ modulo.titulo }}</li>
      </ol>
    </nav>
    <button type="button" class="btn btn-sm btn-outline-dark fw-semibold" routerLink="/principal">
      ← Volver al panel
    </button>
  </div>

  <!-- CONTENIDO DEL MÓDULO -->
  <div class="tarjeta-vidrio p-4">
    <div class="encabezado-modulo d-flex justify-content-between align-items-start flex-wrap gap-2 pb-3 mb-3">
      <div>
        <h5 class="fw-bold mb-0"> {{ modulo.icono }} {{ modulo.titulo }}</h5>
        <small class="text-muted">Responsable: <strong>{{ modulo.responsable }}</strong></small>
      </div>
      <span
        class="badge"
        [ngClass]="{
          'bg-success-subtle text-success-emphasis': modulo.estado === 'Funcional',
          'bg-warning-subtle text-warning-emphasis': modulo.estado === 'En bosquejo'
        }"
      >
        {{ modulo.estado }}
      </span>
    </div>

    <!-- Submenú: solo aparece si el módulo tiene más de una sección -->
    <ul class="nav nav-pills submenu-modulo mb-3 gap-1" *ngIf="modulo.secciones.length > 0">
      <li class="nav-item" *ngFor="let seccion of modulo.secciones">
        <a class="nav-link" [routerLink]="['/', modulo.ruta, seccion.ruta]" routerLinkActive="active">
          {{ seccion.etiqueta }}
        </a>
      </li>
    </ul>

    <!-- Aquí se pinta la sección activa (ruta hija) -->
    <router-outlet></router-outlet>
  </div>
</div>
