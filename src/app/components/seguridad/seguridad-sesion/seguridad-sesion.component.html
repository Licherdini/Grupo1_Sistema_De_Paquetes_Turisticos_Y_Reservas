<!-- Indicadores de la sesión activa -->
<div class="row g-3">
  <div class="col-6 col-lg-3">
    <div class="superficie-vidrio indicador p-3 h-100">
      <small class="indicador-etiqueta">Usuario autenticado</small>
      <strong class="indicador-valor">{{ authService.usuarioActual() | uppercase }}</strong>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="superficie-vidrio indicador p-3 h-100">
      <small class="indicador-etiqueta">Rol asignado</small>
      <strong class="indicador-valor">{{ authService.rolActual() }}</strong>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="superficie-vidrio indicador p-3 h-100">
      <small class="indicador-etiqueta">Inicio de sesión</small>
      <strong class="indicador-valor">{{ authService.horaInicioSesion() | date: 'dd/MM/yyyy HH:mm:ss' }}</strong>
    </div>
  </div>
  <div class="col-6 col-lg-3">
    <div class="superficie-vidrio indicador p-3 h-100">
      <small class="indicador-etiqueta">Duración de la sesión</small>
      <strong class="indicador-valor indicador-duracion">{{ duracionSesion() }}</strong>
    </div>
  </div>
</div>

<div class="d-flex justify-content-end mt-4">
  <button type="button" class="btn btn-danger btn-sm px-4 fw-semibold" (click)="salirDelSistema()">
    Cerrar sesión
  </button>
</div>
