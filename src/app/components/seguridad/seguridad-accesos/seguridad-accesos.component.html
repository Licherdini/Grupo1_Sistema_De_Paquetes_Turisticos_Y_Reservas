<div class="superficie-vidrio p-3">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h6 class="fw-bold mb-0">Registro de accesos</h6>
    <div class="d-flex flex-wrap align-items-center gap-2">
      <div class="campo-buscar">
        <app-icono nombre="buscar" />
        <input
          type="text"
          class="form-control form-control-sm campo-filtro"
          placeholder="Filtrar por usuario..."
          aria-label="Filtrar registro de accesos por usuario"
          [(ngModel)]="filtroAccesos"
        />
      </div>
      <select
        class="form-select form-control-sm campo-filtro"
        aria-label="Filtrar registro de accesos por resultado"
        [(ngModel)]="filtroResultado"
      >
        <option value="Todos">Todos</option>
        <option value="Concedido">Concedido</option>
        <option value="Denegado">Denegado</option>
      </select>
      <!-- Solo el Administrador ve esta acción; se deshabilita si no hay registros -->
      <button
        *ngIf="authService.esAdministrador()"
        type="button"
        class="btn btn-sm btn-outline-danger fw-semibold d-inline-flex align-items-center gap-1"
        [disabled]="authService.registroAccesos().length === 0"
        (click)="limpiarHistorial()"
      >
        <app-icono nombre="papelera" />
        Limpiar historial
      </button>
    </div>
  </div>

  <div class="alert alert-info py-2 small mb-3" role="status" *ngIf="mensajeNotificacion()">
    {{ mensajeNotificacion() }}
  </div>

  <div class="table-responsive">
    <table class="table tabla-vidrio align-middle mb-0">
      <thead>
        <tr>
          <th>Fecha y hora</th>
          <th>Usuario</th>
          <th>Resultado</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let acceso of accesosFiltrados(); let i = index"
          class="fila-animada"
          [style.animation-delay]="i * 40 + 'ms'"
        >
          <td>{{ acceso.fechaHora | date: 'dd/MM HH:mm:ss' }}</td>
          <td class="fw-semibold">{{ acceso.usuario }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                'bg-success-subtle text-success-emphasis': acceso.exitoso,
                'bg-danger-subtle text-danger-emphasis': !acceso.exitoso
              }"
            >
              {{ acceso.exitoso ? 'Concedido' : 'Denegado' }}
            </span>
          </td>
        </tr>
        <tr *ngIf="accesosFiltrados().length === 0">
          <td colspan="3" class="text-center text-muted py-3">No hay accesos para mostrar.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
