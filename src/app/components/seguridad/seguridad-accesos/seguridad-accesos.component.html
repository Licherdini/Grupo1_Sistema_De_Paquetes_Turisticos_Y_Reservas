<div class="superficie-vidrio p-3">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h6 class="fw-bold mb-0">Registro de accesos</h6>
    <div class="d-flex flex-wrap align-items-center gap-2">
      <div class="campo-buscar">
        <app-icono nombre="buscar" />
        <input
          type="text"
          class="form-control form-control-sm campo-filtro"
          placeholder="Filtrar por usuario..."
          aria-label="Filtrar registro de accesos por usuario"
          [(ngModel)]="filtroAccesos"
        />
      </div>
      <select
        class="form-select form-select-sm campo-filtro"
        aria-label="Filtrar registro de accesos por resultado"
        [(ngModel)]="filtroResultado"
      >
        <option>Todos</option>
        <option>Concedido</option>
        <option>Denegado</option>
      </select>
      <!-- Solo el Administrador ve esta acción; se deshabilita si no hay registros -->
      <button
        *ngIf="authService.esAdministrador()"
        type="button"
        class="btn btn-sm btn-outline-danger fw-semibold d-inline-flex align-items-center gap-1"
        [disabled]="authService.registroAccesos().length === 0"
        (click)="limpiarHistorial()"
      >
        <app-icono nombre="papelera" />
        Limpiar historial
      </button>
    </div>
  </div>

  <div class="alert alert-info py-2 small mb-3" role="status" *ngIf="mensajeNotificacion()">
    {{ mensajeNotificacion() }}
  </div>

  <!-- tabla: sin cambios (thead y tbody actuales) -->
</div>
