<svg
  viewBox="0 0 24 24"
  width="1em"
  height="1em"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
  [attr.fill]="relleno() ? 'currentColor' : 'none'"
>
  @for (trazo of trazos(); track $index) {
    <path [attr.d]="trazo" />
  }
</svg>
