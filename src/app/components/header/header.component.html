<header class="main-header shadow-sm">
  <!-- IZQUIERDA: logo y nombre de la empresa (siempre visibles) -->
  <div class="brand">
    <div class="brand-logo"><svg class="icono-avion" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div>
    <div>
      <span class="brand-name">{{ proyectoInfo.nombreEmpresa }}</span>
      <small class="brand-subtitle text-muted">{{ proyectoInfo.subtituloEmpresa }}</small>
    </div>
  </div>

  <!-- DERECHA (solo teléfono): botón de hamburguesa -->
  <button
    type="button"
    class="btn-menu"
    aria-label="Abrir o cerrar el menú"
    aria-controls="menu-principal"
    [attr.aria-expanded]="menuAbierto"
    (click)="alternarMenu()"
  >
    <svg *ngIf="!menuAbierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
    <svg *ngIf="menuAbierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="5" y1="5" x2="19" y2="19" />
      <line x1="19" y1="5" x2="5" y2="19" />
    </svg>
  </button>

  <!-- OPCIONES: en escritorio van en línea; en teléfono se despliegan bajo el header -->
  <nav id="menu-principal" class="header-actions" [ngClass]="{ 'menu-abierto': menuAbierto }">
    <!-- Sin sesión -->
    <ng-container *ngIf="!authService.estaLogueado()">
      <button type="button" class="btn btn-outline-dark btn-sm px-3 fw-semibold" (click)="cerrarMenu()">
        Acerca de
      </button>
      <button type="button" class="btn btn-dark btn-sm px-3 fw-semibold" (click)="irALogin()">
        Iniciar Sesión
      </button>
    </ng-container>

    <!-- Con sesión -->
    <ng-container *ngIf="authService.estaLogueado()">
      <span class="badge bg-primary-subtle text-primary-emphasis px-3 py-2 rounded-pill fw-semibold">
        <svg class="icono-usuario" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v2h20v-2c0-3.33-6.67-5-10-5z"/></svg>
        Usuario: {{ authService.usuarioActual() | uppercase }}
      </span>
      <button type="button" class="btn btn-danger btn-sm px-3 fw-semibold" (click)="salirDelSistema()">
        Cerrar Sesión
      </button>
    </ng-container>
  </nav>
</header>
